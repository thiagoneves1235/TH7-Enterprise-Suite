name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint check-types test build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @th7/enterprise-suite-web exec playwright install --with-deps chromium
      - run: pnpm --filter @th7/enterprise-suite-web test:e2e

  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: pnpm install --no-frozen-lockfile
      - name: Build auth process-health endpoint
        run: pnpm --filter @th7/enterprise-suite-auth-service build
      - name: Start auth service
        env:
          NODE_ENV: production
          CORS_ORIGINS: http://localhost:3000
          PORT: 3001
        run: |
          pnpm --filter @th7/enterprise-suite-auth-service start > /tmp/th7-auth.log 2>&1 &
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3001/api/v1/health
      - uses: grafana/setup-k6-action@v1
      - name: Run health endpoint smoke load
        run: k6 run infra/load/auth-health.js